<!DOCTYPE html>
<html
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>

  <head>
    <meta charset="UTF-8">
    <title>Test Spring</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">
    <link rel="icon" th:href="@{/favicon.ico}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.7.0/css/all.css">

    <!-- Estilos CSS personalizados para el fondo de pantalla completa -->
    <style>
      body {
        /* Ruta de la imagen de fondo */
        background-image: url('https://mdbootstrap.com/img/Photos/Others/images/47.jpg');
        /* Centra la imagen horizontal y verticalmente */
        background-position: center center;
        /* Evita que la imagen se repita si la pantalla es muy grande */
        background-repeat: no-repeat;
        /* Fuerza a que el fondo se quede fijo al hacer scroll */
        background-attachment: fixed;
        /* Escala la imagen para cubrir toda la ventana sin perder su proporción */
        background-size: cover;
        /* Asegura que el body ocupe al menos el 100% de la altura visible */
        min-height: 100vh;
      }

      /* Opcional: Añade contraste al texto si la foto de fondo es muy clara o muy oscura */
      .text-contrast {
        color: #ffffff; /* Cambia a #000000 si tu fondo es blanco */
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6); /* Sombra para leer mejor */
      }
    </style>
  </head>

  <body>
  
    <!-- Añadida la clase text-contrast para que el texto resalte sobre la foto -->
    <section class="pt-5 pb-5 text-contrast">
      <div class="container pb-5 pt-5">
        <div class="row align-items-center justify-content-between ">
          <div class="col-12 col-md-5 pr-md-5 ">
            <h1 class="mb-3 mt-5 display-4 fw-bold">Hello</h1>
            <p class="lead">Welcome to the project</p>
            <div class="d-flex mt-3 mb-1">
              <a class="btn btn-primary btn-lg mt-md-3" th:href="@{/loginGet}"
                role="button">Start</a>
            </div>
          </div>
          <!-- src="https://www.youtube.com/embed/SwYN7mTi6HM?rel=0" -->

        </div>
      </div>
    </section>

    <script 
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js">
    </script>
    
  </body>

</html>
