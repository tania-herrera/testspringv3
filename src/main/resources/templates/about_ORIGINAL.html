<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" 
	  xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href=" https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css ">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.7.0/css/all.css">
    <link rel="shortcut icon" th:href="@{/favicon.ico}" type="image/x-icon">
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-role: 'Arial', sans-serif;
        }

        h1,
        h2,
        h3 {
            color: #bb86fc;
            text-align: center;
        }

        .contact-form {
            background-color: #1e1e1e;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .form-control {
            background-color: #2b2b2b;
            border: 1px solid #444;
            color: #e0e0e0;
            border-radius: 8px;
        }

        .form-control:focus {
            background-color: #333;
            border-color: #bb86fc;
            box-shadow: none;
        }

        .btn-primary {
            background-color: #bb86fc;
            border: none;
            border-radius: 8px;
            transition: transform 0.2s ease-in-out;
        }

        .btn-primary:hover {
            background-color: #9c67f0;
            transform: scale(1.05);
        }

        .contact-info {
            background-color: #1e1e1e;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .social-icon {
            font-size: 1.5rem;
            color: #bb86fc;
            margin-right: 15px;
            transition: transform 0.3s ease-in-out;
        }

        .social-icon:hover {
            transform: scale(1.2);
            color: #9c67f0;
        }

        a {
            color: #bb86fc;
            text-decoration: none;
            transition: color 0.3s ease-in-out;
        }

        a:hover {
            color: #9c67f0;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .contact-form {
                padding: 20px;
            }

            .contact-info {
                margin-top: 15px;
            }
        }
    </style>
</head>

<body>

    <nav th:replace="~{standardLayouts/navbar :: navbar1}"></nav>

    <div class="container py-5">
        <h1 class="mb-5">Contact Us</h1>
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="contact-form">
                    <h2 class="mb-4">Send Us a Message</h2>
                    <form>
                        <div class="mb-3">
                            <label for="name" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                        </div>
                        <div class="mb-3">
                            <label for="message" class="form-label">Message</label>
                            <textarea class="form-control" id="message" rows="5" placeholder="Enter your message"
                                required></textarea>
                        </div>
                        <a type="button" class="btn btn-primary w-100" th:href="@{/homeGet}">Submit</a>
                    </form>
                </div>
            </div>
        </div>
        <div class="row mt-5">
            <div class="col-md-6">
                <div class="contact-info">
                    <h2>Contact Information</h2>
                    <p><strong>Address:</strong> Avenida de Manoteras, 32, Hortaleza, 28050, Madrid</p>
                    <p><strong>Email:</strong> <a href="mailto:info@hamason.com">info@hamason.com</a></p>
                    <p><strong>Phone:</strong> +34 688 888 888</p>
                </div>
            </div>
            <div class="col-md-6">
                <div class="contact-info">
                    <h2>Follow Us</h2>
                    <div class="d-flex align-items-center">
                        <a href="https://facebook.com" target="_blank"><i class="bi bi-facebook social-icon"></i></a>
                        <a href="https://twitter.com" target="_blank"><i class="bi bi-twitter social-icon"></i></a>
                        <a href="https://instagram.com" target="_blank"><i class="bi bi-instagram social-icon"></i></a>
                        <a href="https://linkedin.com" target="_blank"><i class="bi bi-linkedin social-icon"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

<footer th:replace="~{standardLayouts/footer :: footer1}"></footer>

<div th:replace="~{standardLayouts/script :: script1}"></div>

<div th:replace="~{standardLayouts/script :: script1}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

</html>
