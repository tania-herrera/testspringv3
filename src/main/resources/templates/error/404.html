<!DOCTYPE html>
<html
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>

  <head>
    <meta charset="UTF-8">
    <title>Test Spring</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">
    <link rel="icon" th:href="@{/favicon.ico}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.7.0/css/all.css">

    <!-- Estilos CSS personalizados para el fondo de pantalla completa -->
    <style>
      body {
        /* Ruta de la imagen de fondo */
        /* background-image: url('https://mdbootstrap.com/img/Photos/Others/images/47.jpg'); */
        background-image: url([[@{/img/img_error_404_Chatgpt.jpg}]]);
        /* Centra la imagen horizontal y verticalmente */
        background-position: center center;
        /* Evita que la imagen se repita si la pantalla es muy grande */
        background-repeat: no-repeat;
        /* Fuerza a que el fondo se quede fijo al hacer scroll */
        background-attachment: fixed;
        /* Escala la imagen para cubrir toda la ventana sin perder su proporción */
        background-size: cover;
        /* Asegura que el body ocupe al menos el 100% de la altura visible */
        min-height: 100vh;
      }

      /* Opcional: Añade contraste al texto si la foto de fondo es muy clara o muy oscura */
      .text-contrast {
        color: #ffffff; /* Cambia a #000000 si tu fondo es blanco */
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6); /* Sombra para leer mejor */
      }
    </style>
  </head>

  <body>
  
      <div class="container-fluid min-vh-100 d-flex flex-column">

        <!-- Primeros 2/3: contenido 404 -->
        <div class="flex-grow-1 d-flex align-items-center justify-content-center">
            <div class="text-center text-contrast">
                <!-- h1 class="display-1 fw-bold">404</h1>
                <h2>PÁGINA NO ENCONTRADA</h2>
                <p class="lead">
                    Lo sentimos, la página que buscas no existe o fue movida.
                </p -->
            </div>
        </div>
  
          <!-- Último tercio: botón -->
        <div class="flex-grow-0 d-flex align-items-center justify-content-center"
             style="height: 33.33vh;">

            <a class="btn btn-light btn-lg px-5"
               th:href="@{/welcome}"
               role="button">
                Back to welcome page
            </a>

        </div>

      </div>

    <script 
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js">
    </script>
    
  </body>

</html>
