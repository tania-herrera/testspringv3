  <body>

  <div class="pb-5 pt-5 bg-dark text-light min-vw-100 min-vh-100">
  
    <div th:replace="~{standardLayouts/navbar :: navbar1}">
  		AQUI DEBERIA SALIR EL navbar
  	</div>
  	
    <section class="pb-5 pt-5 bg-dark text-light min-vw-100 min-vh-100">
      <div class="container">
        <div class="row text-center ">
          <div class="col-12 col-md-8 col-lg-7">
            <h3 class="fw-bold display-4 text-white">Customer view</h3>
          </div>
        </div>
        
       <div class="row pt-4">
          <div class="col-12">
             <div th:object="${customer}">
            
              <div class="row">
				<div class="col input-group mb-2">
				  <span class="input-group-text bg-secondary text-light" id="inputGroup-sizing-default">Name</span>
				  <input readonly th:value="${customer.getName()}" type="text" class="form-control" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-default">
				</div>
             
				<div class="col input-group mb-2">
				  <span class="input-group-text bg-secondary text-light" id="inputGroup-sizing-default">Age</span>
                  <input readonly th:value="${customer.getAge()}" type="text" class="form-control" placeholder="Vat number">
                </div>

				<div class="col input-group mb-2">
				  <span class="input-group-text bg-secondary text-light" id="inputGroup-sizing-default">Total Purchases</span>
                  <input readonly th:value="${customer.getTotalPurchases()}" type="text" class="form-control" placeholder="Phone">
                </div>

              </div>

              <div class="row mt-4">
				<div class="input-group mb-2">
				  <span class="input-group-text bg-secondary text-light" id="inputGroup-sizing-default">Card number</span>
                  <input readonly th:value="${customer.getCardNumber()}" type="text" class="form-control" placeholder="Address">
                </div>
              </div>

                   	</p>
                </div>     		              		
			  </div>
			  -->
				
              <div class="row mt-4">
			    <div class="col text-center">
 	               <a type="button" th:href="@{/customerList}"
    	              class="btn btn-success w-100 btn-round mb-3 btn-rised">
        	          Back 
            	    </a>
            	</div>
              
              </div>
                          
            </div>
          </div>
        </div>

      </div>

    </section>

    <div th:replace="~{standardLayouts/footer :: footer1}">
