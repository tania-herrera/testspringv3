<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"      
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

  <head>
    <meta charset="UTF-8">
    <title>Tdd101</title>

    <meta charset="utf-8">
    <meta name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">
    <link rel="icon" th:href="@{/favicon.ico}">
    <link rel="stylesheet"
      href=" https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css ">
    <link rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.2.0/css/all.css">

  </head>

  <body>

    <section class="pt-5 pb-5 bg-dark text-white vh-100">
      <div class="container py-4">

        <div class="h-100 p-5 text-white bg-dark rounded-3">
          <div class="container-fluid py-5">
            <h1 class="display-5 fw-bold text-white" th:text="${username} + ', ¿seguro que te quieres ir?'"></h1>
            <p class="col-md-8 fs-4">Quédate con nosotros. No vas a encontrar una forma
            mejor de pasar el día...</p>
            
            <form th:action="@{/logoutPost}" method="POST">
	            <button class="btn btn-warning btn-lg" type="submit">Sí, me quiero ir</button>
	            <a th:href="@{/inicioLogado}" class="btn btn-success btn-lg" type="button" role="button">
	            	No, me quedo un poco más
	            </a>       	
            </form>
            
          </div>
        </div>




      </div>
      <div class="row align-items-md-stretch">
        <div class="col-md-12">

        </div>

      </div>
    </section>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
      crossorigin="anonymous"></script>


  </body>

</html>
